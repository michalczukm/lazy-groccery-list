name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. new push to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (typecheck / test / lint / fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.0

      - uses: actions/setup-node@v6
        with:
          node-version: lts/krypton
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm fmt:check

  preview:
    name: Deploy PR preview
    needs: verify
    # Only for PRs from the same repo — fork PRs can't access secrets.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.0

      - uses: actions/setup-node@v6
        with:
          node-version: lts/krypton
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `wrangler versions upload` is invoked directly rather than through a
      # package.json script, so it does not pick up the `pnpm vendor` prefix that
      # `pnpm dev`/`pnpm deploy` carry. Without this step public/vendor would be
      # empty (it is gitignored) and the preview would ship a broken importmap.
      - name: Vendor client deps
        run: pnpm vendor

      # Uploads a new *version* of the same worker (does NOT shift prod traffic).
      # Wrangler may print a preview URL; when it cannot, the PR still keeps the
      # verify job green and records that preview deployment was skipped.
      - name: Upload preview version
        id: upload
        run: |
          set -o pipefail
          set +e
          pnpm exec wrangler versions upload --minify 2>&1 | tee upload.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            if grep -q "code: 10211" upload.log && grep -qi "Durable Object migration" upload.log; then
              echo "skipped=durable-object-migration" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            exit "$status"
          fi
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' upload.log | head -n1 || true)
          if [ -z "$url" ]; then
            echo "skipped=no-preview-url" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment preview URL on PR
        if: steps.upload.outputs.skipped == ''
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: pr-preview
          message: |
            ### 🚀 PR preview deployed

            A preview version of this PR is live at:

            **${{ steps.upload.outputs.url }}**

            Uses the same secrets and bindings as production, but does not
            affect production traffic. Updated on every push.

            <sub>commit `${{ github.event.pull_request.head.sha }}`</sub>

      - name: Comment skipped preview on PR
        if: steps.upload.outputs.skipped != ''
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: pr-preview
          message: |
            ### PR preview skipped

            Cloudflare/Wrangler could not provide a usable PR preview URL for
            this branch, so preview deployment is skipped. This can happen for
            Workers with Durable Object migrations or when
            `wrangler versions upload` succeeds without printing a preview URL.

            Verification still ran in CI.

            <sub>commit `${{ github.event.pull_request.head.sha }}`</sub>

  deploy:
    name: Deploy to Cloudflare Workers
    needs: verify
    # Only on merge/push to main — PR runs stop after verify.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.0

      - uses: actions/setup-node@v6
        with:
          node-version: lts/krypton
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy
        run: pnpm deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
